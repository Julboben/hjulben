name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: npm run check
      - name: Trail catalog is up to date
        run: |
          npm run trails
          git diff --exit-code trails/catalog.json
      - name: Type check
        run: npm run typecheck
      # The playtest tools' checks run in slow-tests.yml, and only when
      # something they use changes.
      - name: Tests
        run: npm test
      - name: Install dependencies
        run: npm ci
      - name: Online API tests
        run: npm run test:online
